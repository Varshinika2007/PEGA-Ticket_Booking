<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - Ticketify</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">🎟️ Ticketify</div>

    <nav>

        <a href="index.html">Home</a>
        <a href="events.html">Events</a>

    </nav>

</header>



<section class="form-section">

    <div class="form-card">

        <div class="form-icon">
            💳
        </div>

        <h1>Payment</h1>

        <p>Complete your booking securely.</p>


        <form onsubmit="makePayment(event)">

            <label>Cardholder Name</label>

            <input
                type="text"
                placeholder="Enter cardholder name"
                required
            >


            <label>Card Number</label>

            <input
                type="text"
                placeholder="XXXX XXXX XXXX XXXX"
                maxlength="19"
                required
            >


            <div class="payment-row">

                <div>

                    <label>Expiry</label>

                    <input
                        type="text"
                        placeholder="MM/YY"
                        required
                    >

                </div>


                <div>

                    <label>CVV</label>

                    <input
                        type="password"
                        placeholder="***"
                        maxlength="3"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="form-button">
                Pay ₹500
            </button>

        </form>

    </div>

</section>


<script src="js/booking.js"></script>

</body>
</html>
